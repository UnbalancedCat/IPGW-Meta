name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

env:
  GOTOOLCHAIN: local

jobs:
  verify:
    name: Verify every release gate
    runs-on: ubuntu-latest
    steps:
      - name: Check out complete history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Require completed M0 through M3
        run: make release-gate
      - name: Check documentation contracts
        run: go run ./cmd/doccheck --check
      - name: Run tests
        run: go test ./...
      - name: Vet
        run: go vet ./...
      - name: Run race detector
        run: go test -race ./...
      - name: Install pinned gitleaks
        run: go install github.com/zricethezav/gitleaks/v8@v8.30.1
      - name: Verify secret scanner with synthetic canaries
        run: bash scripts/test-gitleaks.sh
      - name: Scan complete Git history for secrets
        run: '"$(go env GOPATH)/bin/gitleaks" git --config=.gitleaks.toml --redact --verbose --log-opts="--all --full-history --reflog" .'

  native-test:
    name: Native tests (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
          - macos-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Run native tests
        run: go test ./...

  publish:
    name: Build once, verify, and publish atomic bundles
    needs:
      - verify
      - native-test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      RELEASE_VERSION_FILE: ${{ runner.temp }}/ipgw-release-version
    steps:
      - name: Check out the tagged commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Verify exact release tag
        shell: bash
        run: |
          set -euo pipefail
          test "$(git describe --tags --exact-match HEAD)" = "$GITHUB_REF_NAME"
      - name: Write validated release version input
        env:
          RELEASE_VERSION: ${{ github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! $RELEASE_VERSION =~ ^[0-9A-Za-z._+-]+$ ]]; then
            echo "release tag contains unsupported characters" >&2
            exit 2
          fi
          printf '%s\n' "$RELEASE_VERSION" >"$RELEASE_VERSION_FILE"
      - name: Build and package all six targets once
        run: make package BUILD_DIR=build/release RELEASE_DIR=release
      - name: Verify outer and inner checksums
        shell: bash
        run: |
          set -euo pipefail
          test "$(find release -maxdepth 1 -type f | wc -l)" -eq 9
          test "$(wc -l <release/SHA256SUMS)" -eq 8
          (
            cd release
            sha256sum --check SHA256SUMS
          )
          grep -Fx "IPGW_VERSION='$GITHUB_REF_NAME'" release/install.sh
          grep -Fx "\$Version = '$GITHUB_REF_NAME'" release/install.ps1
          bash -n release/install.sh
          expected_unix=$(printf '%s\n' LICENSE SHA256SUMS bundle-manifest.json ipgw ipgw-legacy ipgw-meta launcher-default.yaml | sort)
          expected_windows=$(printf '%s\n' LICENSE SHA256SUMS bundle-manifest.json ipgw.exe ipgw-legacy.exe ipgw-meta.exe launcher-default.yaml | sort)
          for archive in release/ipgw-meta-*.tar.gz release/ipgw-meta-*.zip; do
            stage=$(mktemp -d)
            archive_base=$(basename "$archive")
            if [[ $archive == *.zip ]]; then
              expected=$expected_windows
              listed=$(unzip -Z1 "$archive" | sort)
              test "$listed" = "$expected"
              unzip -q "$archive" -d "$stage"
              target=${archive_base#ipgw-meta-}
              target=${target%.zip}
              entry0=ipgw.exe
              entry1=ipgw-meta.exe
              entry2=ipgw-legacy.exe
            else
              expected=$expected_unix
              listed=$(tar -tzf "$archive" | sort)
              test "$listed" = "$expected"
              type_count=0
              while IFS= read -r archive_line; do
                test "${archive_line:0:1}" = '-'
                type_count=$((type_count + 1))
              done < <(tar -tvzf "$archive")
              test "$type_count" -eq 7
              tar -xzf "$archive" -C "$stage"
              target=${archive_base#ipgw-meta-}
              target=${target%.tar.gz}
              entry0=ipgw
              entry1=ipgw-meta
              entry2=ipgw-legacy
            fi
            actual=$(find "$stage" -mindepth 1 -maxdepth 1 -type f -printf '%f\n' | sort)
            test "$actual" = "$expected"
            (
              cd "$stage"
              sha256sum --check SHA256SUMS
            )
            jq -e \
              --arg platform "$target" \
              --arg version "$GITHUB_REF_NAME" \
              --arg entry0 "$entry0" \
              --arg entry1 "$entry1" \
              --arg entry2 "$entry2" '
                (type == "object") and
                ((keys | sort) == ([
                  "schema_version", "product", "module", "version", "platform",
                  "entries", "launcher_default", "layout", "self_update", "uninstall"
                ] | sort)) and
                (.schema_version == 1) and
                (.product == "ipgw-meta") and
                (.module == "github.com/UnbalancedCat/ipgw-meta") and
                (.version == $version) and
                (.platform == $platform) and
                (.launcher_default == "meta") and
                (.layout == "versioned-bundle-v1") and
                (.self_update == false) and
                ((.uninstall | keys | sort) == (["remove_all_three_entries", "preserve_user_config"] | sort)) and
                (.uninstall.remove_all_three_entries == true) and
                (.uninstall.preserve_user_config == true) and
                ((.entries | type) == "array") and
                ((.entries | length) == 3) and
                ([.entries[].path] == [$entry0, $entry1, $entry2]) and
                (all(.entries[];
                  ((keys | sort) == (["path", "sha256", "size"] | sort)) and
                  (.sha256 | type == "string") and
                  (.sha256 | test("^[0-9a-f]{64}$")) and
                  (.size | type == "number") and
                  (.size > 0) and
                  (.size == (.size | floor))
                ))
              ' "$stage/bundle-manifest.json"
            while IFS=$'\t' read -r entry_path entry_hash entry_size; do
              test -f "$stage/$entry_path"
              test "$(sha256sum "$stage/$entry_path" | awk '{print $1}')" = "$entry_hash"
              test "$(stat -c '%s' "$stage/$entry_path")" = "$entry_size"
            done < <(jq -r '.entries[] | [.path, .sha256, (.size | tostring)] | @tsv' "$stage/bundle-manifest.json")
            rm -rf -- "$stage"
          done
      - name: Prepare required release notes
        shell: bash
        run: |
          cat >release-notes.md <<'EOF'
          ## IPGW-Meta v1 release contract

          - Existing installations remain in `legacy` mode; new installations default to `meta`.
          - Use `ipgw-meta profile migrate` to preview migration, or add `--yes` for automation.
          - Terminal QR live evidence is limited to the redacted records committed under `docs/evidence/`.
          - SMS OTP remains `observed_anonymous + detected_only`; it is detected but not submitted or claimed as supported.
          - Self-update remains disabled. Install or roll back only complete three-entry bundles.
          - Windows, Linux, and macOS are cross-built; real-network platform coverage is exactly the scope recorded in `docs/evidence/`.
          EOF
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          args=(--verify-tag --title "IPGW-Meta $GITHUB_REF_NAME" --notes-file release-notes.md)
          if [[ $GITHUB_REF_NAME == *-* ]]; then
            args+=(--prerelease)
          fi
          gh release create "$GITHUB_REF_NAME" release/* "${args[@]}"
